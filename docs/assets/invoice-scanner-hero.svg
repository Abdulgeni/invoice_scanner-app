<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Invoice Scanner</title>
  <desc id="d">A paper invoice is scanned, read by Gemini, and reviewed as editable fields on a phone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05302A"/><stop offset="0.55" stop-color="#0B6E5A"/><stop offset="1" stop-color="#0E8F74"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DF9D0" stop-opacity="0"/><stop offset="0.5" stop-color="#7DF9D0"/><stop offset="1" stop-color="#7DF9D0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7DF9D0" stop-opacity="0.35"/><stop offset="1" stop-color="#7DF9D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="930" cy="210" r="260" fill="url(#glow)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#fff">
    <rect x="64" y="70" width="168" height="30" rx="15" fill="#fff" fill-opacity="0.14"/>
    <text x="84" y="91" font-size="14" font-weight="600" letter-spacing="2" fill="#BFF5E3">FLUTTER · GEMINI · DRIFT</text>
    <text x="64" y="170" font-size="64" font-weight="800" letter-spacing="1">Invoice Scanner</text>
    <text x="64" y="212" font-size="23" fill="#D3EDE4">Scan. Extract. Review. Never a silent number.</text>
    <g font-size="15" font-weight="600">
      <rect x="64" y="252" width="118" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="84" y="274">On-device</text>
      <rect x="194" y="252" width="128" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="214" y="274">Offline queue</text>
      <rect x="334" y="252" width="150" height="34" rx="17" fill="#fff" fill-opacity="0.16"/><text x="354" y="274">Exact money</text>
    </g>
    <text x="64" y="340" font-size="15" fill="#9FE3CC">Clean Architecture · BLoC · Firebase AI Logic · 556 tests passing</text>
  </g>

  <!-- Paper invoice -->
  <g transform="rotate(-6 640 220)" filter="url(#sh)">
    <rect x="540" y="80" width="190" height="250" rx="10" fill="#F7F8F6"/>
    <rect x="556" y="98" width="70" height="10" rx="5" fill="#0B6E5A"/>
    <rect x="556" y="118" width="110" height="6" rx="3" fill="#C9D3CE"/>
    <rect x="556" y="134" width="90" height="6" rx="3" fill="#C9D3CE"/>
    <g fill="#DDE5E0"><rect x="556" y="168" width="158" height="6" rx="3"/><rect x="556" y="184" width="158" height="6" rx="3"/><rect x="556" y="200" width="158" height="6" rx="3"/><rect x="556" y="216" width="158" height="6" rx="3"/></g>
    <rect x="620" y="262" width="94" height="30" rx="6" fill="#D3EDE4"/>
    <rect x="630" y="274" width="74" height="8" rx="4" fill="#0B6E5A"/>
    <rect x="530" y="176" width="210" height="4" fill="url(#scan)"/>
  </g>

  <!-- Flow arrow -->
  <g stroke="#7DF9D0" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 10">
    <path d="M748 215 C 790 215, 800 215, 850 215"/>
  </g>
  <path d="M846 205 L864 215 L846 225 Z" fill="#7DF9D0"/>

  <!-- Phone -->
  <g filter="url(#sh)">
    <rect x="880" y="40" width="210" height="340" rx="30" fill="#0A1512"/>
    <rect x="890" y="52" width="190" height="316" rx="22" fill="#F7F8F6"/>
    <rect x="958" y="58" width="54" height="8" rx="4" fill="#0A1512"/>
    <rect x="890" y="76" width="190" height="44" fill="#0B6E5A"/>
    <text x="906" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Review invoice</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#44525C">
      <text x="906" y="146">VENDOR</text><rect x="906" y="152" width="158" height="26" rx="6" fill="#fff" stroke="#D3EDE4"/>
      <rect x="914" y="162" width="82" height="7" rx="3.5" fill="#14201C" opacity="0.75"/>
      <text x="906" y="198">DATE</text><rect x="906" y="204" width="74" height="26" rx="6" fill="#fff" stroke="#D3EDE4"/>
      <text x="990" y="198">CURRENCY</text><rect x="990" y="204" width="74" height="26" rx="6" fill="#fff" stroke="#D3EDE4"/>
      <text x="906" y="250">TOTAL</text><rect x="906" y="256" width="158" height="30" rx="6" fill="#fff" stroke="#0B6E5A" stroke-width="1.5"/>
      <text x="918" y="277" font-size="16" font-weight="700" fill="#14201C">1,248.50</text>
    </g>
    <rect x="906" y="308" width="158" height="38" rx="19" fill="#0B6E5A"/>
    <text x="985" y="332" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Save</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
