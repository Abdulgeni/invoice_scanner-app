<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Invoice Scanner layered architecture</title>
  <desc id="d">Presentation depends on Domain; Data implements Domain; external SDKs are confined to data adapters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F6"/><stop offset="1" stop-color="#E8F1EC"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B6E5A" flood-opacity="0.18"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B6E5A"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8A5A00"/></marker>
  </defs>
  <style>
    .f{font-family:Segoe UI,Helvetica,Arial,sans-serif}
    .h{font-size:20px;font-weight:800;fill:#fff}
    .s{font-size:13px;fill:#D3EDE4}
    .b{font-size:14px;font-weight:600;fill:#14201C}
    .m{font-size:12px;fill:#44525C}
  </style>
  <rect width="1200" height="720" rx="24" fill="url(#bg)"/>
  <text class="f" x="600" y="50" text-anchor="middle" font-size="28" font-weight="800" fill="#0B6E5A">Layered Clean Architecture</text>
  <text class="f m" x="600" y="74" text-anchor="middle" font-size="14">Dependencies point inward. Enforced by architecture_test.dart, not by discipline.</text>

  <!-- composition root -->
  <rect x="60" y="100" width="1080" height="64" rx="14" fill="#44525C" filter="url(#sh)"/>
  <text class="f h" x="84" y="128">app/ · Composition Root</text>
  <text class="f s" x="84" y="150">AppScope · createAppScope · AppConfig (dart-define) · Firebase bootstrap · extractor injection</text>

  <!-- presentation -->
  <rect x="60" y="196" width="1080" height="140" rx="14" fill="#0B6E5A" filter="url(#sh)"/>
  <text class="f h" x="84" y="226">Presentation</text>
  <text class="f s" x="84" y="247">BLoC · Cubits · Screens · l10n</text>
  <g class="f b">
    <rect x="84" y="268" width="190" height="48" rx="10" fill="#D3EDE4"/><text x="179" y="297" text-anchor="middle">Scan BLoC</text>
    <rect x="290" y="268" width="190" height="48" rx="10" fill="#D3EDE4"/><text x="385" y="297" text-anchor="middle">ReviewScreen</text>
    <rect x="496" y="268" width="190" height="48" rx="10" fill="#D3EDE4"/><text x="591" y="297" text-anchor="middle">HistoryCubit</text>
    <rect x="702" y="268" width="190" height="48" rx="10" fill="#D3EDE4"/><text x="797" y="297" text-anchor="middle">InvoiceDetailScreen</text>
    <rect x="908" y="268" width="208" height="48" rx="10" fill="#D3EDE4"/><text x="1012" y="297" text-anchor="middle">Failure Cards</text>
  </g>

  <!-- domain -->
  <rect x="60" y="384" width="1080" height="130" rx="14" fill="#0E8F74" filter="url(#sh)"/>
  <text class="f h" x="84" y="414">Domain</text>
  <text class="f s" x="84" y="435">Pure Dart. Imports no Flutter, Drift, Firebase or dart:io.</text>
  <g class="f b">
    <rect x="84" y="452" width="190" height="44" rx="10" fill="#fff"/><text x="179" y="479" text-anchor="middle">Entities &amp; Money</text>
    <rect x="290" y="452" width="190" height="44" rx="10" fill="#fff"/><text x="385" y="479" text-anchor="middle">Use Cases</text>
    <rect x="496" y="452" width="190" height="44" rx="10" fill="#fff"/><text x="591" y="479" text-anchor="middle">Validators</text>
    <rect x="702" y="452" width="190" height="44" rx="10" fill="#fff"/><text x="797" y="479" text-anchor="middle">InvoiceFailure</text>
    <rect x="908" y="452" width="208" height="44" rx="10" fill="#fff"/><text x="1012" y="479" text-anchor="middle">Repository Ports</text>
  </g>

  <!-- data -->
  <rect x="60" y="562" width="1080" height="130" rx="14" fill="#8A5A00" filter="url(#sh)"/>
  <text class="f h" x="84" y="592">Data · Adapters</text>
  <text class="f s" x="84" y="613" fill="#FFE9BF">Each SDK lives only in its own adapter.</text>
  <g class="f b">
    <rect x="84" y="630" width="190" height="44" rx="10" fill="#FFF3DB"/><text x="179" y="657" text-anchor="middle">Drift SQLite</text>
    <rect x="290" y="630" width="190" height="44" rx="10" fill="#FFF3DB"/><text x="385" y="657" text-anchor="middle">Gemini · AI Logic</text>
    <rect x="496" y="630" width="190" height="44" rx="10" fill="#FFF3DB"/><text x="591" y="657" text-anchor="middle">Auth · App Check</text>
    <rect x="702" y="630" width="190" height="44" rx="10" fill="#FFF3DB"/><text x="797" y="657" text-anchor="middle">Daily Usage Cap</text>
    <rect x="908" y="630" width="208" height="44" rx="10" fill="#FFF3DB"/><text x="1012" y="657" text-anchor="middle">Scanner · Image</text>
  </g>

  <!-- arrows -->
  <g stroke="#0B6E5A" stroke-width="3" fill="none" marker-end="url(#ar)">
    <path d="M600 336 V380"/>
  </g>
  <g stroke="#8A5A00" stroke-width="3" fill="none" marker-end="url(#ar2)" stroke-dasharray="8 6">
    <path d="M600 562 V518"/>
  </g>
  <text class="f m" x="612" y="364" font-size="12">uses</text>
  <text class="f m" x="612" y="545" font-size="12">implements</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
