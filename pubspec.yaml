name: invoice_scanner
description: Production-grade invoice scanner (Gemini via Firebase AI Logic).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  firebase_app_check: ^0.5.1
  firebase_remote_config: ^7.0.1
  firebase_ai: ^5.1.0

  flutter_bloc: ^9.1.1
  drift: ^2.35.0
  connectivity_plus: ^7.0.0
  cunning_document_scanner: ^3.0.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  equatable: ^3.0.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
  image: ^4.12.0
  drift_flutter: ^0.3.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: "#D3EDE4"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_monochrome: "assets/icon/app_icon.png"
  remove_alpha_ios: true
